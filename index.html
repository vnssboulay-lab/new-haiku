<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birds Punctuate the Days | Joyce Clement</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-container">
        <header class="top-band">
            <p>Poetry &amp; Nature</p>
        </header>

        <section class="title-section">
            <h1>Birds Punctuate the Days</h1>
            <p class="author">By Joyce Clement</p>
        </section>

        <main class="main-content">
            <figure class="image-box">
                <img src="img/Haiku_image.jpg" alt="A blue speckled egg resting in a nest">
            </figure>

            <section class="haiku-box" aria-labelledby="poem-heading">
                <h2 id="poem-heading">Haiku</h2>
                <div class="poem">
                    <p>Period</p>
                    <p>One blue egg all summer long</p>
                    <p>Now Gone</p>
                </div>
            </section>
        </main>

        <footer class="bottom-band">
            <p>Birds Punctuate the Days &nbsp; | &nbsp; Joyce Clement</p>
        </footer>
    </div>
</body>
</html>
